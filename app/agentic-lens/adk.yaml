specVersion: "1.18"
project:
  name: "agentic-lens"
  region: "us-west1"

agents:
  # The Root — name uses underscore (matches IAM principal agentic_lens_supervisor)
  - name: "agentic_lens_supervisor"
    path: "agents/supervisor"

  # The Engineering Squad
  - name: "agentic_lens_eng_lead"
    path: "agents/eng_lead"
    description: "Engineering Manager - Orchestrates Scout, Coder, and Quality and Security Reviewer."

  - name: "agentic_lens_eng_scout"
    path: "agents/eng_scout"
    description: "Architect - Plans infrastructure requirements."

  - name: "agentic_lens_eng_coder"
    path: "agents/eng_coder"
    description: "Developer - Generates Terraform/Python code."

  - name: "agentic_lens_eng_quality_and_security_reviewer"
    path: "agents/eng_quality_and_security_reviewer"
    description: "Quality and Security Reviewer - Validates code against policy."

  # X-Ray Department (IAM & Security)
  - name: "agentic_lens_xray_manager"
    path: "agents/xray_manager"
    description: "Department Head - Orchestrates IAM provisioning."

  - name: "agentic_lens_xray_librarian"
    path: "agents/xray_librarian"
    description: "Researcher - Fetches repo context securely."

  - name: "agentic_lens_xray_architect"
    path: "agents/xray_architect"
    description: "Planner - Lists required infrastructure."

  - name: "agentic_lens_xray_specialist"
    path: "agents/xray_specialist"
    description: "Builder - Generates secure Terraform."

  - name: "agentic_lens_xray_auditor"
    path: "agents/xray_auditor"
    description: "Compliance - Validates Least Privilege."

  # Events Department (3rd)
  - name: "agentic_lens_events"
    path: "agents/events"

  # Chat Department (4th) — General Assistant; uses its own agent identity (AGENT_IDENTITY)
  - name: "agentic_lens_chat"
    path: "agents/chat"

runtime:
  type: "vertex_ai_agent_engine"
  identity: "AGENT_IDENTITY"
