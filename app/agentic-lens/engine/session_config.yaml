# Agent Engine runtime settings - Agentic-Prism
# Session and memory managed by Vertex AI (not Redis).
# CMEK: Apply security/kms.tf and set kms_key_id below to encrypt memory/session.

session:
  persistence: ENABLED  # Managed by Vertex AI

memory_bank:
  enabled: true  # Long-term context across sessions
  project: agentic-prismv333
  # kms_key_id: projects/<PROJECT_ID>/locations/us-central1/keyRings/agentic-lens-ring/cryptoKeys/agent-engine-key  # From security/kms.tf output

identity_enforcement: STRICT
# Reject any agent deployment that attempts to use legacy Service Account keys.
# Only AGENT_IDENTITY (per-agent managed identity) is allowed.
